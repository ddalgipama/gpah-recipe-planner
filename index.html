<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GPAH 레시피 플래너</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #18211f;
      --muted: #6c7871;
      --line: #e7ece8;
      --paper: #ffffff;
      --wash: #f4f8f5;
      --main: #35a76f;
      --main-dark: #17795d;
      --side: #d88845;
      --salad: #69a857;
      --team-a: #e7f7ee;
      --team-b: #fff3df;
      --cream: #fbf6ea;
      --peach: #fff0e7;
      --blue-soft: #eaf5ff;
      --shadow: 0 18px 46px rgba(24, 35, 28, 0.08);
      --soft-shadow: 0 8px 24px rgba(24, 35, 28, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, Inter, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(112deg, #79bd91 0%, #91cfaa 31%, #f5efe4 31.2%, #fbfaf6 100%);
    }
    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .shell { max-width: 1320px; margin: 0 auto; padding: 26px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      margin-bottom: 18px; padding: 18px 20px; border: 1px solid rgba(255,255,255,0.86);
      border-radius: 22px; background: rgba(255,255,255,0.91); box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .mark {
      width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center;
      color: #fff; font-weight: 900;
      background: linear-gradient(135deg, #36b378 0%, #c28443 100%);
      box-shadow: 0 16px 34px rgba(37, 135, 91, 0.24);
    }
    h1 { margin: 0; font-size: clamp(1.8rem, 3vw, 2.65rem); line-height: 1.05; letter-spacing: 0; }
    .brand-copy { display: grid; gap: 5px; }
    .calendar-subtitle {
      display: none;
      align-items: center;
      gap: 5px;
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 900;
      line-height: 1.25;
    }
    .calendar-subtitle.show { display: inline-flex; }
    .top-actions { display: flex; align-items: end; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    .field { display: grid; gap: 6px; min-width: 0; }
    label { color: var(--muted); font-size: 0.78rem; font-weight: 800; }
    input, select, textarea {
      width: 100%; max-width: 100%; min-width: 0; min-height: 50px; border: 1px solid transparent; border-radius: 15px;
      padding: 0 16px; color: var(--ink); background: #f2f4f2; outline: none;
      box-shadow: none;
    }
    textarea { min-height: 86px; padding-top: 10px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: transparent; box-shadow: 0 0 0 2px rgba(83, 177, 117, 0.26); background: #fff; }
    .top-select { min-width: 150px; }
    .btn {
      min-height: 48px; border-radius: 15px; padding: 0 16px; color: var(--ink);
      background: #fff; border: 1px solid var(--line); font-weight: 900;
      box-shadow: 0 8px 18px rgba(42,82,63,0.05);
    }
    .btn:hover { border-color: #c6d4cc; background: #fbfdfb; transform: translateY(-1px); }
    .btn.primary { color: #fff; background: var(--main); border-color: var(--main); box-shadow: 0 14px 26px rgba(83,177,117,0.28); }
    .btn.primary:hover { background: var(--main-dark); border-color: var(--main-dark); }
    .btn.icon { width: 42px; padding: 0; font-size: 1.35rem; line-height: 1; }
    .tabs {
      display: inline-flex; gap: 6px; padding: 6px; margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.82); border-radius: 20px; background: rgba(255,255,255,0.78);
      box-shadow: var(--soft-shadow); backdrop-filter: blur(16px);
    }
    .tab { min-width: 126px; min-height: 46px; border-radius: 16px; color: var(--muted); background: transparent; font-weight: 900; }
    .tab.active { color: #fff; background: var(--main); box-shadow: 0 12px 24px rgba(83,177,117,0.24); }
    .view { display: none; }
    .view.active { display: block; }
    .panel {
      background: rgba(255,255,255,0.92); border: 1px solid rgba(255,255,255,0.82);
      border-radius: 22px; box-shadow: var(--shadow); overflow: hidden;
      backdrop-filter: blur(18px);
    }
    .panel-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.72); }
    .panel-header.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-title { margin: 0; font-size: 1.04rem; line-height: 1.2; }
    .menu-layout { display: grid; grid-template-columns: minmax(360px, 440px) minmax(0, 1fr); gap: 18px; align-items: start; }
    .search-area { display: grid; gap: 12px; padding: 16px; }
    .search-row { display: grid; grid-template-columns: 1fr 42px; gap: 10px; }
    .category-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .menu-filter-tabs { width: min(520px, 100%); }
    .category-tabs button, .slot-tabs button {
      min-height: 44px; border-radius: 15px; color: var(--muted); background: #f2f4f2; font-weight: 900;
      border: 1px solid transparent;
    }
    .category-tabs button.active, .slot-tabs button.active { color: #fff; background: var(--main); box-shadow: 0 10px 20px rgba(83,177,117,0.22); }
    .ingredient-groups {
      display: grid; gap: 12px; max-height: 650px; overflow: auto;
      padding: 16px; border-top: 1px solid var(--line); background: rgba(250,253,251,0.7);
    }
    .group-title {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 4px 0 8px; color: var(--muted); font-size: 0.82rem; font-weight: 900;
    }
    .recipe-card, .drawer-card {
      width: 100%; text-align: left; padding: 14px; border: 1px solid rgba(223,233,226,0.95);
      border-radius: 18px; color: inherit; background: rgba(255,255,255,0.98); box-shadow: 0 8px 20px rgba(24,23,37,0.05);
    }
    .recipe-card:hover, .recipe-card.selected {
      transform: translateY(-2px); border-color: rgba(83,177,117,0.58); box-shadow: 0 16px 34px rgba(83,177,117,0.16);
    }
    .recipe-name { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 900; line-height: 1.25; }
    .recipe-title { display: inline-flex; align-items: center; gap: 7px; min-width: 0; flex-wrap: wrap; }
    .allergy-icons { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; }
    .allergy-icon {
      display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 999px;
      background: #fff5dc; border: 1px solid rgba(210,132,64,0.24); font-size: 0.82rem; line-height: 1;
    }
    .recipe-card-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
    .recipe-open { text-align: left; color: inherit; background: transparent; padding: 0; }
    .recipe-actions { display: flex; gap: 6px; }
    .mini-btn { min-height: 30px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--line); color: var(--muted); background: #fff; font-size: 0.74rem; font-weight: 900; }
    .mini-btn.danger { color: #a7433b; }
    .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .badge {
      display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px;
      color: var(--muted); background: #eef6f1; font-size: 0.75rem; font-weight: 800;
    }
    .badge.main { color: var(--main-dark); background: rgba(53,167,111,0.14); }
    .badge.side { color: #a95d20; background: rgba(216,136,69,0.16); }
    .badge.salad { color: #477d42; background: rgba(105,168,87,0.15); }
    .detail { padding: 16px; display: grid; gap: 13px; }
    .detail h3 { margin: 0; font-size: 1.28rem; line-height: 1.22; }
    .recipe-photo {
      width: 100%; max-height: 360px; object-fit: cover; display: block;
      border: 1px solid var(--line); border-radius: 18px; background: var(--wash);
    }
    .detail-block { border: 1px solid var(--line); border-radius: 18px; padding: 16px; background: rgba(255,255,255,0.96); }
    .detail-block strong { display: block; margin-bottom: 7px; color: var(--muted); font-size: 0.78rem; }
    .detail-block pre { margin: 0; white-space: pre-wrap; word-break: keep-all; line-height: 1.55; font-family: inherit; font-size: 0.92rem; }
    .note-block {
      border-color: #f5d98a;
      background: #fff8df;
      color: #5f4a13;
    }
    .note-block strong {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #8b6814;
      font-size: 0.84rem;
    }
    .note-block strong::before {
      content: "⚠";
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: #ffe89f;
      color: #9a6a00;
      font-size: 13px;
      line-height: 1;
    }
    .empty { padding: 18px; color: var(--muted); line-height: 1.5; }
    .calendar-tools {
      display: grid; grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px; align-items: end; padding: 16px; border-bottom: 1px solid var(--line); background: rgba(248,252,249,0.86);
    }
    .calendar-settings {
      display: none; grid-template-columns: minmax(180px, 1fr) repeat(4, minmax(130px, 180px));
      gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.92);
    }
    .calendar-settings.open { display: grid; }
    .big-register { min-height: 54px; font-size: 1rem; }
    .btn.small { min-height: 34px; padding: 0 10px; font-size: 0.82rem; }
    .calendar-wrap { overflow: auto; max-height: calc(100vh - 300px); }
    .mobile-calendar { display: none; }
    .week-tabs {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
      border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.92);
    }
    .week-tab {
      flex: 0 0 auto; min-height: 38px; padding: 0 13px; border-radius: 14px;
      border: 1px solid var(--line); background: #eef6f1; color: var(--muted); font-weight: 900;
    }
    .week-tab.active { color: #fff; background: var(--main); border-color: var(--main); }
    .mobile-week-body { display: grid; gap: 10px; padding: 12px; }
    .mobile-day-card {
      border: 1px solid var(--line); border-radius: 18px; background: #fff;
      box-shadow: var(--soft-shadow); overflow: hidden;
    }
    .mobile-day-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px; background: rgba(239,248,243,0.9); border-bottom: 1px solid var(--line); font-weight: 900;
    }
    .mobile-day-head span:last-child { color: var(--muted); font-size: 0.84rem; }
    .mobile-meal {
      display: grid; gap: 7px; padding: 12px; border-top: 1px solid var(--line);
      color: inherit; background: #fff; text-align: left; width: 100%;
    }
    .mobile-meal:first-of-type { border-top: 0; }
    .mobile-meal.has-menu { cursor: pointer; }
    .mobile-meal.has-menu:hover { background: #fbfdfb; }
    .mobile-meal-title { color: var(--main-dark); font-weight: 900; font-size: 0.88rem; }
    .mobile-menu-line {
      display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: start;
      font-size: 0.88rem; line-height: 1.35;
    }
    .mobile-menu-line strong { color: var(--muted); font-size: 0.76rem; }
    .calendar-heading {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.92);
    }
    .calendar-heading h3 { margin: 0; font-size: 1.12rem; }
    .calendar-heading span { color: var(--muted); font-size: 0.84rem; font-weight: 800; }
    .calendar {
      min-width: 1120px; display: grid; grid-template-columns: 92px 78px repeat(5, minmax(170px, 1fr));
      border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: #fff;
    }
    .cal-cell { min-height: 82px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 9px; }
    .cal-head { min-height: 44px; display: grid; place-items: center; color: #fff; background: #20362f; font-weight: 900; position: sticky; top: 0; z-index: 4; text-align: center; }
    .week-cell { display: grid; place-items: center; text-align: center; font-weight: 900; position: sticky; left: 0; z-index: 3; }
    .meal-label { display: grid; place-items: center; color: var(--muted); background: #f8faf8; font-weight: 900; position: sticky; left: 92px; z-index: 3; }
    .team-a { background: var(--team-a); }
    .team-b { background: var(--team-b); }
    .meal-cell { display: grid; gap: 8px; align-content: start; background: #ffffff; }
    .meal-cell.has-menu { cursor: pointer; }
    .meal-cell.has-menu:hover { outline: 2px solid rgba(45,111,107,0.34); outline-offset: -2px; }
    .meal-cell.is-empty { cursor: pointer; }
    .meal-cell.is-empty:hover { outline: 2px dashed rgba(83,177,117,0.35); outline-offset: -2px; }
    .meal-cell.team-a { background: rgba(231,247,238,0.78); }
    .meal-cell.team-b { background: rgba(255,243,223,0.78); }
    .registered { display: grid; gap: 4px; }
    .cell-date { color: var(--muted); font-size: 0.74rem; font-weight: 900; }
    .registered-line { display: grid; grid-template-columns: 46px 1fr; gap: 6px; align-items: center; min-width: 0; font-size: 0.78rem; line-height: 1.35; }
    .registered-line strong { color: var(--muted); font-size: 0.72rem; }
    .registered-line span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .free-entry {
      min-height: 28px; padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,0.84);
      color: var(--muted); font-size: 0.8rem; font-weight: 800;
    }
    .author { color: var(--muted); font-size: 0.76rem; font-weight: 800; padding-top: 3px; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 14px 0 0; border-top: 1px solid var(--line); background: transparent; }
    .purchase-summary { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .purchase-summary .stat:nth-child(-n+3) { grid-column: span 2; }
    .purchase-summary .stat:nth-child(n+4) { grid-column: span 3; }
    .stat { border: 1px solid var(--line); border-radius: 18px; padding: 15px; background: rgba(255,255,255,0.96); box-shadow: 0 8px 20px rgba(24,23,37,0.05); }
    .stat span { display: block; color: var(--muted); font-size: 0.76rem; font-weight: 800; }
    .stat strong { display: block; margin-top: 5px; font-size: 1.28rem; }
    .purchase-tools {
      display: grid; grid-template-columns: repeat(2, minmax(170px, 220px)) 1fr;
      gap: 10px; align-items: end; padding: 16px; border-bottom: 1px solid var(--line); background: rgba(248,252,249,0.86);
    }
    .purchase-body { display: grid; gap: 16px; padding: 16px; }
    .purchase-table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,0.96); box-shadow: 0 10px 24px rgba(42,82,63,0.04); }
    .purchase-table { width: 100%; border-collapse: collapse; min-width: 840px; }
    .purchase-table th, .purchase-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .purchase-table th { color: var(--muted); background: #fbfcfb; font-size: 0.78rem; font-weight: 900; }
    .purchase-table tr:last-child td { border-bottom: 0; }
    .purchase-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .purchase-section-total {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--main-dark);
      background: rgba(53, 167, 111, 0.13);
      border: 1px solid rgba(53, 167, 111, 0.22);
      font-weight: 900;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .buy-link { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 0 12px; border-radius: 8px; background: var(--main); color: #fff; font-size: 0.78rem; font-weight: 900; text-decoration: none; white-space: nowrap; }
    .buy-link.missing { background: #eef1ef; color: var(--muted); pointer-events: none; }
    .source-list { color: var(--muted); font-size: 0.78rem; line-height: 1.45; }
    .needs-review { display: grid; gap: 8px; }
    .review-item { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,0.94); }
    .review-item strong { display: block; margin-bottom: 4px; }
    .drawer { border-bottom: 1px solid var(--line); padding: 16px; background: rgba(255,255,255,0.92); display: none; }
    .drawer.open { display: block; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .drawer-head h3 { margin: 0; font-size: 1.05rem; }
    .drawer-head-actions { display: inline-flex; align-items: center; gap: 7px; }
    .drawer-close {
      display: none;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
    }
    .drawer-grid { display: grid; grid-template-columns: 260px 1fr; gap: 12px; align-items: start; }
    .registration-fields { display: grid; gap: 10px; }
    .free-items { display: grid; gap: 8px; }
    .free-item-row { display: grid; grid-template-columns: 1fr 38px; gap: 8px; align-items: end; }
    .free-item-row .mini-btn { min-height: 42px; }
    .free-remove-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      border: 1px solid rgba(211, 72, 72, .28);
      color: #d34848;
      background: #fff5f5;
      font-size: 22px;
      line-height: 1;
      font-weight: 900;
      box-shadow: none;
    }
    .target-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .slot-tabs { display: grid; gap: 8px; margin-top: 10px; }
    .drawer-results { display: grid; gap: 8px; max-height: 310px; overflow: auto; }
    .current-meal-list {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .current-meal-list-title {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
    }
    .current-meal-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 36px;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }
    .drawer-feedback {
      display: none;
      min-height: 32px;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(53, 167, 111, 0.12);
      color: var(--main-dark);
      font-size: 0.82rem;
      font-weight: 900;
    }
    .drawer-feedback.show { display: inline-flex; }
    .drawer-feedback.danger {
      background: #fff0f0;
      color: #c94343;
    }
    .drawer-card { display: grid; grid-template-columns: 48px 1fr 78px; gap: 10px; align-items: center; }
    .slot-action-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .plus-btn, .minus-btn { width: 36px; height: 36px; border-radius: 10px; color: #fff; background: var(--main); font-size: 1.15rem; font-weight: 900; box-shadow: 0 10px 20px rgba(53,167,111,0.2); }
    .minus-btn { color: #d34848; background: #fff5f5; border: 1px solid rgba(211,72,72,.28); box-shadow: none; }
    .plus-btn:hover { background: var(--main-dark); }
    .modal-backdrop { position: fixed; inset: 0; display: none; place-items: center; padding: 18px; background: rgba(24,33,31,0.30); backdrop-filter: blur(8px); z-index: 20; }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(720px, 100%); max-height: calc(100vh - 36px); overflow: auto; border-radius: 8px; border: 1px solid rgba(255,255,255,0.82); background: var(--paper); box-shadow: 0 26px 72px rgba(24,33,31,0.18); }
    .modal-action-row { display: inline-flex; align-items: center; justify-content: flex-end; gap: 7px; }
    .modal-body { display: grid; gap: 12px; padding: 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 1050px) {
      .shell { padding: 18px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .top-actions { justify-content: flex-start; }
      .menu-layout { grid-template-columns: 1fr; }
      .calendar-tools { grid-template-columns: 1fr; }
      .calendar-settings { grid-template-columns: 1fr 1fr; }
      .drawer-grid { grid-template-columns: 1fr; }
      .calendar-wrap { max-height: none; }
    }
    @media (max-width: 640px) {
      body {
        background: #fcfcfc;
      }
      .shell {
        min-height: 100vh;
        min-height: 100dvh;
        padding: calc(10px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom));
      }

<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">G</div>
        <div class="brand-copy">
          <h1>GPAH 레시피 플래너</h1>
          <p class="calendar-subtitle" id="calendarSubtitle"></p>
        </div>
      </div>
    </header>

    <nav class="tabs" aria-label="메인 화면">
      <button type="button" class="tab active" data-view="menu">메뉴검색</button>
      <button type="button" class="tab" data-view="calendar">캘린더</button>
      <button type="button" class="tab" data-view="purchase">재료구매</button>
      <button type="button" class="tab" data-view="settings">설정</button>
    </nav>

    <section class="view active" id="menuView">
      <div class="menu-layout">
        <section class="panel">
          <div class="panel-header between">
            <h2 class="panel-title">메뉴검색</h2>
            <div class="category-tabs menu-filter-tabs" aria-label="메뉴 카테고리">
              <button type="button" class="active" data-category="all"><span>🍱</span>전체</button>
              <button type="button" data-category="메인"><span>🍲</span>메인</button>
              <button type="button" data-category="사이드"><span>🍽️</span>사이드</button>
              <button type="button" data-category="샐러드"><span>🥗</span>샐러드</button>
            </div>
          </div>
          <div class="search-area">
            <div class="search-row menu-search-row">
              <div class="field">
                <label for="search">메뉴 이름·재료 검색 · 40인분 기준</label>
                <input id="search" type="search" placeholder="예: 닭다리살, 간장조림">
              </div>
            </div>
          </div>
          <div class="ingredient-groups" id="recipeGroups"></div>
        </section>
        <section class="panel inline-detail-panel">
          <div class="panel-header"><h2 class="panel-title">레시피 상세</h2></div>
          <div class="detail" id="recipeDetail"></div>
        </section>
      </div>
    </section>

    <section class="view" id="calendarView">
      <section class="panel">
        <div class="panel-header between calendar-titlebar">
          <h2 class="panel-title">과정 캘린더</h2>
        </div>
        <div class="drawer" id="registrationDrawer"></div>
        <div class="calendar-heading" id="calendarHeading"></div>
        <div class="calendar-wrap"><div class="calendar" id="calendar"></div></div>
        <div class="mobile-calendar" id="mobileCalendar"></div>
      </section>
    </section>

    <section class="view" id="purchaseView">
      <section class="panel">
        <div class="panel-header"><h2 class="panel-title">재료구매</h2></div>
        <div class="purchase-tools">
          <div class="field">
            <label for="purchaseStart">시작일</label>
            <input id="purchaseStart" type="date">
          </div>
          <div class="field">
            <label for="purchaseEnd">종료일</label>
            <input id="purchaseEnd" type="date">
          </div>
          <div class="top-actions">
            <button type="button" class="btn" id="purchaseOneDay">하루</button>
            <button type="button" class="btn" id="purchaseThisWeek">1주일</button>
            <button type="button" class="btn" id="purchaseFullCourse">전체 과정</button>
          </div>
        </div>
        <div class="purchase-body" id="purchaseResults"></div>
      </section>
    </section>

    <section class="view" id="settingsView">
      <section class="panel">
        <div class="panel-header"><h2 class="panel-title">설정</h2></div>
        <div class="settings-body">
          <div class="admin-lock" id="adminLock">
            <div class="field">
              <label for="adminPassword">관리자 비밀번호</label>
              <input id="adminPassword" type="password" autocomplete="current-password" placeholder="비밀번호 입력">
            </div>
            <button type="button" class="btn primary" id="unlockAdmin">관리자 기능 열기</button>
          </div>
          <div class="settings-admin" id="settingsAdmin">
          <div class="settings-actions">
              <button type="button" class="settings-action" id="openSheetsSettings"><span>🔗</span><b>Google Sheets 연동</b></button>
              <button type="button" class="settings-action" id="toggleCalendarSettings"><span>📅</span><b>캘린더 생성</b></button>
              <button type="button" class="settings-action" id="exportExcel"><span>⬇️</span><b>엑셀 다운로드</b></button>
              <button type="button" class="settings-action" id="openNewRecipe"><span>＋</span><b>신규메뉴 등록</b></button>
            </div>
            <section class="admin-menu-manager">
              <div class="section-title-row">
                <h3>메뉴 관리</h3>
                <span>관리자 전용</span>
              </div>
              <div class="admin-menu-search field">
                <label for="adminMenuSearch">수정할 메뉴 검색</label>
                <input id="adminMenuSearch" type="search" placeholder="메뉴명, 재료, 분류 검색">
              </div>
              <div class="admin-menu-list" id="adminMenuList"></div>
            </section>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div class="modal-backdrop" id="calendarCreateModal" role="dialog" aria-modal="true" aria-labelledby="calendarCreateTitle">
    <div class="modal">
      <div class="panel-header between">
        <h2 class="panel-title" id="calendarCreateTitle">캘린더 생성</h2>
        <button type="button" class="btn small" id="closeCalendarCreate">닫기</button>
      </div>
      <div class="modal-body">
        <div class="calendar-settings open calendar-create-form" id="calendarSettings">
          <div class="field">
            <label for="calendarTitle">캘린더 제목</label>
            <input id="calendarTitle" placeholder="예: SKE33, SCOTW35">
          </div>
          <div class="field">
            <label for="calendarCourseSelect">주차 선택</label>
            <select id="calendarCourseSelect">
              <option value="4-scotw">4주</option>
              <option value="5-scotw" selected>5주</option>
              <option value="8-ske">8주</option>
            </select>
          </div>
          <div class="field">
            <label for="calendarLanguageSelect">언어</label>
            <select id="calendarLanguageSelect">
              <option value="중국어">중국어</option>
              <option value="내밀" selected>내밀</option>
            </select>
          </div>
          <div class="field">
            <label for="startDate">시작일</label>
            <input id="startDate" type="date">
          </div>
          <div class="field">
            <label for="startTeam">시작팀</label>
            <select id="startTeam">
              <option value="a">A팀</option>
              <option value="b">B팀</option>
            </select>
          </div>
          <div class="field">
            <label for="servingCount">인원수</label>
            <input id="servingCount" type="number" min="1" step="1" placeholder="예: 45">
          </div>
        </div>
        <div class="detail-feedback" id="calendarCreateStatus" role="status" aria-live="polite"></div>
        <button type="button" class="btn primary calendar-create-submit" id="createCalendar">생성하기</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="newRecipeModal" role="dialog" aria-modal="true" aria-labelledby="newRecipeTitle">
    <div class="modal">
      <div class="panel-header"><h2 class="panel-title" id="newRecipeTitle">신규메뉴등록</h2></div>
      <form class="modal-body" id="newRecipeForm">
        <div class="form-grid">
          <div class="field"><label for="newName">메뉴 이름</label><input id="newName" required></div>
          <div class="field"><label for="newType">분류</label><select id="newType"><option>메인</option><option>사이드</option><option>샐러드</option></select></div>
        </div>
        <div class="field"><label for="newTime">소요시간</label><input id="newTime" placeholder="예: 70~85분"></div>
        <div class="field"><label for="newIngredients">주재료</label><textarea id="newIngredients" placeholder="재료명과 수량을 줄바꿈으로 입력"></textarea></div>
        <div class="field"><label for="newSauce">소스재료</label><textarea id="newSauce" placeholder="소스재료를 줄바꿈으로 입력"></textarea></div>
        <div class="field"><label for="newRecipeText">레시피</label><textarea id="newRecipeText"></textarea></div>
        <div class="field"><label for="newNotes">주의사항</label><textarea id="newNotes"></textarea></div>
        <div class="top-actions">
          <button type="button" class="btn" id="cancelNewRecipe">닫기</button>
          <button type="submit" class="btn primary">등록</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="sheetsModal" role="dialog" aria-modal="true" aria-labelledby="sheetsTitle">
    <div class="modal">
      <div class="panel-header"><h2 class="panel-title" id="sheetsTitle">Google Sheets 연동</h2></div>
      <div class="modal-body">
        <div class="field">
          <label for="sheetsUrl">Apps Script 웹앱 URL</label>
          <input id="sheetsUrl" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="free-entry" id="sheetsStatus">URL을 저장하면 메뉴 데이터를 Google Sheets에서 불러올 수 있습니다.</div>
      <div class="top-actions">
          <button type="button" class="btn" id="closeSheetsSettings">닫기</button>
          <button type="button" class="btn" id="syncSheetsNow">시트에서 불러오기</button>
          <button type="button" class="btn primary" id="saveSheetsSettings">저장</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="mealDetailModal" role="dialog" aria-modal="true" aria-labelledby="mealDetailTitle">
    <div class="modal">
      <div class="panel-header between">
        <h2 class="panel-title" id="mealDetailTitle">등록 메뉴 상세</h2>
        <div class="modal-action-row">
          <button type="button" class="btn small" id="editMealDetail">수정하기</button>
          <button type="button" class="btn small" id="printMealDetail">인쇄하기</button>
        </div>
      </div>
      <div class="modal-body" id="mealDetailBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="recipeDetailModal" role="dialog" aria-modal="true" aria-labelledby="recipeDetailTitle">
    <div class="modal">
      <div class="panel-header between">
        <h2 class="panel-title" id="recipeDetailTitle">레시피 상세</h2>
        <button type="button" class="btn small" id="closeRecipeDetail">닫기</button>
      </div>
      <div class="modal-body detail" id="recipeDetailModalBody"></div>
    </div>
  </div>

  <script>
    const starterRecipes = [];
    const starterRecipeIds = new Set(["gpah-1"]);
    const courses = {
      "4-scotw": { label: "4주", weeks: 4, schoolPrefix: "SCOTW" },
      "5-scotw": { label: "5주", weeks: 5, schoolPrefix: "SCOTW" },
      "8-ske": { label: "8주", weeks: 8, schoolPrefix: "SKE" }
    };
    const days = ["월", "화", "수", "목", "금"];
    const mealLabels = { lunch: "점심", dinner: "저녁" };
    const mealSlots = {
      lunch: [["main", "메인"], ["side", "사이드"], ["salad", "샐러드"], ["rice", "밥"], ["free", "그외메뉴"]],
      dinner: [["main", "메인"], ["side", "사이드"], ["rice", "밥"], ["free", "그외메뉴"]]
    };
    const slotType = { main: "메인", side: "사이드", salad: "샐러드", rice: "밥", free: "그외메뉴" };
    const recipeStoreKey = "gpah-recipes-v2";
    const deletedRecipeStoreKey = "gpah-deleted-recipes-v1";
    const planStoreKey = "gpah-calendar-plan-v2";
    const calendarSettingsKey = "gpah-calendar-settings-v1";
    const sheetsSettingsKey = "gpah-sheets-settings-v1";
    const purchaseAdjustmentsKey = "gpah-purchase-adjustments-v1";
    const defaultSheetsUrl = "https://script.google.com/macros/s/AKfycbxrenm9I2W59G2vI_4dQKjbZLe8OjfKWmTgnj1517h6pC8IV98yRVPZMVTnLsPrhWz_/exec";
    const calendarAdminPassword = "gpah2026";
    const savedSettings = loadJson(calendarSettingsKey, {});
    const sheetsSettings = loadJson(sheetsSettingsKey, {});
    const deletedRecipeIds = loadJson(deletedRecipeStoreKey, []);
    const savedRecipes = loadJson(recipeStoreKey, []);
    const recipes = savedRecipes
      .filter(recipe => !starterRecipeIds.has(recipe.id))
      .filter(recipe => !deletedRecipeIds.includes(recipe.id));
    const state = {
      course: "5-scotw",
      language: "내밀",
      calendarTitle: savedSettings.calendarTitle || "",
      startDate: savedSettings.startDate || "2026-08-31",
      startTeam: savedSettings.startTeam || "a",
      servingCount: Number(savedSettings.servingCount || 40),
      menuCategory: "all",
      search: "",
      adminSearch: "",
      calendarSearch: "",
      registrationAuthor: "",
      sheetsUrl: sheetsSettings.url || defaultSheetsUrl,
      purchaseStart: savedSettings.purchaseStart || savedSettings.startDate || "2026-08-31",
      purchaseEnd: savedSettings.purchaseEnd || formatInputDate(addDays(parseDate(savedSettings.startDate || "2026-08-31"), 6)),
      selectedId: recipes[0]?.id || null,
      editingRecipeId: null,
      activeRegistration: null,
      activeMealDetail: null,
      activeSlot: "main",
      prices: [],
      plan: loadJson(planStoreKey, {}),
      purchaseAdjustments: loadJson(purchaseAdjustmentsKey, {})
    };
    const els = {
      calendarCourseSelect: document.querySelector("#calendarCourseSelect"),
      calendarLanguageSelect: document.querySelector("#calendarLanguageSelect"),
      calendarTitle: document.querySelector("#calendarTitle"),
      startDate: document.querySelector("#startDate"),
      startTeam: document.querySelector("#startTeam"),
      servingCount: document.querySelector("#servingCount"),
      calendarSettings: document.querySelector("#calendarSettings"),
      calendarCreateModal: document.querySelector("#calendarCreateModal"),
      calendarCreateStatus: document.querySelector("#calendarCreateStatus"),
      calendarSubtitle: document.querySelector("#calendarSubtitle"),
      adminPassword: document.querySelector("#adminPassword"),
      adminLock: document.querySelector("#adminLock"),
      settingsAdmin: document.querySelector("#settingsAdmin"),
      adminMenuSearch: document.querySelector("#adminMenuSearch"),
      adminMenuList: document.querySelector("#adminMenuList"),
      search: document.querySelector("#search"),
      recipeGroups: document.querySelector("#recipeGroups"),
      recipeDetail: document.querySelector("#recipeDetail"),
      calendar: document.querySelector("#calendar"),
      mobileCalendar: document.querySelector("#mobileCalendar"),
      drawer: document.querySelector("#registrationDrawer"),
      modal: document.querySelector("#newRecipeModal"),
      sheetsModal: document.querySelector("#sheetsModal"),
      sheetsUrl: document.querySelector("#sheetsUrl"),
      sheetsStatus: document.querySelector("#sheetsStatus"),
      mealDetailModal: document.querySelector("#mealDetailModal"),
      mealDetailBody: document.querySelector("#mealDetailBody"),
      recipeDetailModal: document.querySelector("#recipeDetailModal"),
      recipeDetailTitle: document.querySelector("#recipeDetailTitle"),
      recipeDetailModalBody: document.querySelector("#recipeDetailModalBody"),
      calendarHeading: document.querySelector("#calendarHeading"),
      purchaseStart: document.querySelector("#purchaseStart"),
      purchaseEnd: document.querySelector("#purchaseEnd"),
      purchaseResults: document.querySelector("#purchaseResults")
    };

    function normalize(value) { return String(value || "").toLowerCase().replace(/\s+/g, ""); }
    function currentCourse() { return courses[state.course]; }
    function recipeMatchesContext(recipe) {
      const schoolOk = !recipe.school || recipe.school.startsWith(currentCourse().schoolPrefix);
      return recipe.language === state.language && schoolOk;
    }
    function recipeMatchesQuery(recipe, query) {
      if (!query) return true;
      return normalize([recipe.name, recipe.type, recipe.mainIngredients, recipe.sauceIngredients, recipe.recipe, recipe.chefTeam].join(" ")).includes(normalize(query));
    }
    function visibleRecipes(category = state.menuCategory, query = state.search) {
      return recipes.filter(recipe => (category === "all" || recipeType(recipe) === category) && recipeMatchesQuery(recipe, query));
    }
    function recipeType(recipe) { return normalizeType(recipe?.type || ""); }
    function typeClass(type) {
      const normalized = normalizeType(type);
      return normalized === "메인" ? "main" : normalized === "사이드" ? "side" : normalized === "샐러드" ? "salad" : "";
    }
    function primaryIngredient(recipe) {
      const firstLine = String(recipe.mainIngredients || "").split(/\n|,/).map(item => item.trim()).find(Boolean);
      return firstLine ? firstLine.replace(/\s+\d.*$/, "") : "주재료 미입력";
    }
    const allergyRules = [
      { label: "돼지", icon: "🐷", pattern: /돼지고기|돈육|삼겹살|목살|돼지\s*갈비|항정살|베이컨|햄|소시지|스팸/i },
      { label: "소", icon: "🐮", pattern: /소고기|쇠고기|우육|차돌박이|양지|사태|소\s*갈비|등심|안심|우삼겹/i },
      { label: "닭", icon: "🐔", pattern: /닭고기|닭가슴살|닭다리|닭날개|닭봉|닭안심|계육|치킨/i },
      { label: "생선", icon: "🐟", pattern: /생선|고등어|삼치|연어|대구|명태|동태|가자미|갈치|참치|광어|우럭|어묵|피쉬/i },
      { label: "해산물", icon: "🦐", pattern: /해산물|새우|오징어|문어|낙지|주꾸미|쭈꾸미|조개|홍합|바지락|생굴|굴살|통굴|꽃게|대게|랍스터|가리비|전복/i },
      { label: "땅콩", icon: "🥜", pattern: /땅콩|피넛|peanut/i },
      { label: "매운재료", icon: "🌶️", pattern: /청양고추|홍고추|풋고추|건고추|고춧가루|고추장|캡사이신|페퍼론치노|스리라차|핫소스|칠리소스|마라/i },
      { label: "밀가루", icon: "🌾", pattern: /밀가루|부침가루|튀김가루|중력분|박력분|강력분|빵가루|또띠아|파스타면|우동면|라면사리|소면|칼국수면|중화면|스파게티면/i }
    ];
    function allergyItems(recipe) {
      const source = [recipe.mainIngredients, recipe.sauceIngredients].join("\n");
      return allergyRules.filter(rule => rule.pattern.test(source));
    }
    function allergyBadges(recipe) {
      const items = allergyItems(recipe);
      if (!items.length) return "";
      return `<span class="allergy-icons" aria-label="알러지 표시">${items.map(item => `<span class="allergy-icon" title="${escapeAttr(item.label)}" aria-label="${escapeAttr(item.label)}">${item.icon}</span>`).join("")}</span>`;
    }
    function renderMenu() {
      const visible = visibleRecipes();
      if (!visible.some(recipe => recipe.id === state.selectedId)) state.selectedId = visible[0]?.id || null;
      if (!visible.length) {
        els.recipeGroups.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
        return;
      }
      els.recipeGroups.innerHTML = visible.map(recipe => recipeButton(recipe, "data-recipe-id")).join("");
      els.recipeGroups.querySelectorAll("[data-recipe-id]").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedId = button.dataset.recipeId;
          openRecipeDetailModal(button.dataset.recipeId);
        });
      });
    }
    function recipeButton(recipe, attrName) {
      return `
        <div class="recipe-card ${recipe.id === state.selectedId ? "selected" : ""}">
          <div class="recipe-card-head">
            <div class="recipe-thumb">${recipeThumbHtml(recipe)}</div>
            <div class="recipe-content">
              <div class="recipe-topline">
            <button type="button" class="recipe-open" ${attrName}="${escapeAttr(recipe.id)}">
              <div class="recipe-name"><span class="recipe-title"><span>${escapeHtml(recipe.name)}</span>${allergyBadges(recipe)}</span></div>
              <div class="badge-row">
                <span class="badge ${typeClass(recipe.type)}">${escapeHtml(recipe.type)}</span>
                <span class="badge">${escapeHtml(recipe.time || "미정")}</span>
                <span class="badge">${escapeHtml(primaryIngredient(recipe))}</span>
              </div>
            </button>
              </div>
            </div>
            <span class="recipe-chevron" aria-hidden="true">›</span>
          </div>
        </div>`;
    }
    function renderDetail(recipe) {
      if (!recipe) {
        els.recipeDetail.innerHTML = '<div class="empty">메뉴를 선택하면 재료, 레시피, 소요시간이 표시됩니다.</div>';
        return;
      }
      els.recipeDetail.innerHTML = recipeDetailHtml(recipe, true);
    }
    function openRecipeDetailModal(recipeId) {
      const recipe = recipes.find(item => item.id === recipeId);
      if (!recipe) return;
      state.selectedId = recipe.id;
      els.recipeDetailTitle.textContent = recipe.name;
      els.recipeDetailModalBody.innerHTML = recipeDetailHtml(recipe, false);
      bindRecipeDetailRegistration(recipe);
      els.recipeDetailModal.classList.add("open");
    }
    function closeRecipeDetailModal() {
      els.recipeDetailModal.classList.remove("open");
    }
    function recipeDetailHtml(recipe, includeStats) {
      return `
        <div class="detail-hero">${recipeHeroHtml(recipe)}</div>
        <div class="detail-title-row">
          <h3>${escapeHtml(recipe.name)}</h3>
          ${allergyBadges(recipe)}
        </div>
        <div class="badge-row">
          <span class="badge ${typeClass(recipe.type)}">${escapeHtml(recipe.type)}</span>
          <span class="badge">소요시간 ${escapeHtml(recipe.time || "미정")}</span>
          <span class="badge">40인분 기준</span>
        </div>
        ${ingredientDetailBlock("주재료", recipe.mainIngredients)}
        ${ingredientDetailBlock("소스재료", recipe.sauceIngredients, true)}
        ${detailBlock("레시피", recipe.recipe)}
        ${recipe.notes ? noteBlock(recipe.notes) : ""}
        ${includeStats ? "" : recipeCalendarRegisterHtml(recipe)}
        ${includeStats ? menuStatsHtml() : ""}`;
    }
    function ingredientDetailBlock(title, body, collapsed = false) {
      const lines = String(body || "").split(/\n+/).map(line => line.trim()).filter(Boolean);
      return `
        <section class="detail-block">
          <div class="detail-block-head"><strong>${escapeHtml(title)}</strong><span>40명 기준</span></div>
          ${lines.length ? `<div class="ingredient-lines">${lines.map(line => ingredientLineHtml(line)).join("")}</div>` : "<pre>-</pre>"}
        </section>
      `;
    }
    function ingredientLineHtml(line) {
      const parsed = parseIngredientLine(line);
      if (!parsed) return `<div class="ingredient-row"><span>${escapeHtml(line)}</span></div>`;
      return `<div class="ingredient-row"><span>${escapeHtml(parsed.name)}</span><b>${escapeHtml(formatIngredientAmount(parsed))}</b></div>`;
    }
    function recipeCalendarRegisterHtml(recipe) {
      return `
        <section class="detail-register">
          <h4>캘린더에 메뉴 등록</h4>
          <div class="detail-register-grid">
            <div class="field">
              <label for="detailWeek">주차</label>
              <select id="detailWeek">${Array.from({ length: currentCourse().weeks }, (_, index) => index + 1).map(week => `<option value="${week}">${week}주차</option>`).join("")}</select>
            </div>
            <div class="field">
              <label for="detailDay">요일</label>
              <select id="detailDay">${days.map(day => `<option value="${escapeAttr(day)}">${day}</option>`).join("")}</select>
            </div>
            <div class="field">
              <label for="detailMeal">식사</label>
              <select id="detailMeal">${Object.entries(mealLabels).map(([meal, label]) => `<option value="${meal}">${escapeHtml(label)}</option>`).join("")}</select>
            </div>
          </div>
          <button type="button" class="btn primary" id="registerDetailRecipe">이 메뉴 등록하기</button>
          <div class="detail-feedback" id="detailRegisterFeedback" role="status" aria-live="polite"></div>
        </section>
      `;
    }
    function bindRecipeDetailRegistration(recipe) {
      const button = document.querySelector("#registerDetailRecipe");
      if (!button) return;
      button.addEventListener("click", () => {
        const week = Number(document.querySelector("#detailWeek").value);
        const day = document.querySelector("#detailDay").value;
        const meal = document.querySelector("#detailMeal").value;
        const slot = recipeSlotForMeal(recipe, meal);
        if (!slot) {
          window.alert("저녁에는 샐러드 슬롯이 없습니다. 점심으로 선택하거나 캘린더 메뉴등록에서 다른 슬롯을 선택해주세요.");
          return;
        }
        state.plan[planKey(week, day, meal, slot)] = {
          recipeId: recipe.id,
          author: state.registrationAuthor || ""
        };
        savePlan();
        renderCalendar();
        renderPurchase();
        showDetailFeedback("등록되었습니다.");
      });
    }
    function showDetailFeedback(message) {
      const feedback = document.querySelector("#detailRegisterFeedback");
      if (!feedback) return;
      feedback.textContent = message;
      feedback.classList.add("show");
      window.clearTimeout(state.detailFeedbackTimer);
      state.detailFeedbackTimer = window.setTimeout(() => {
        feedback.classList.remove("show");
      }, 1500);
    }
    function recipeSlotForMeal(recipe, meal) {
      const type = recipeType(recipe);
      if (type === "메인") return "main";
      if (type === "사이드") return "side";
      if (type === "샐러드") return meal === "lunch" ? "salad" : "";
      return "";
    }
    function recipeThumbHtml(recipe) {
      const url = String(recipe?.imageUrl || "").trim();
      if (url) return `<img src="${escapeAttr(url)}" alt="" loading="lazy">`;
      return `<span aria-hidden="true">${escapeHtml(recipeEmoji(recipe))}</span>`;
    }
    function recipeHeroHtml(recipe) {
      const url = String(recipe?.imageUrl || "").trim();
      if (url) return `<img src="${escapeAttr(url)}" alt="${escapeAttr(recipe.name)} 사진" loading="lazy">`;
      return `<span aria-hidden="true">${escapeHtml(recipeEmoji(recipe))}</span>`;
    }
    function recipeEmoji(recipe) {
      const text = normalize([recipe?.name, recipe?.mainIngredients].join(" "));
      if (/닭|치킨/.test(text)) return "🍗";
      if (/돼지|제육|돈육|햄|베이컨/.test(text)) return "🥩";
      if (/소고기|쇠고기|불고기|우육/.test(text)) return "🥩";
      if (/생선|고등어|연어|대구|새우|오징어|해산물/.test(text)) return "🐟";
      if (/샐러드|채소|야채|토마토|양상추/.test(text)) return "🥗";
      if (/밥|카레|덮밥/.test(text)) return "🍛";
      if (recipeType(recipe) === "사이드") return "🍽️";
      if (recipeType(recipe) === "샐러드") return "🥗";
      return "🍲";
    }
    function recipeImageHtml(recipe) {
      const url = String(recipe?.imageUrl || "").trim();
      if (!url) return "";
      return `<img class="recipe-photo" src="${escapeAttr(url)}" alt="${escapeAttr(recipe.name)} 사진" loading="lazy">`;
    }
    function recipePrintImageHtml(recipe) {
      const url = String(recipe?.imageUrl || "").trim();
      if (!url) return "";
      return `<img src="${escapeAttr(url)}" alt="${escapeAttr(recipe.name)} 사진">`;
    }
    function detailBlock(title, body) { return `<section class="detail-block"><strong>${escapeHtml(title)}</strong><pre>${escapeHtml(body || "-")}</pre></section>`; }
    function noteBlock(body) { return `<section class="detail-block note-block"><strong>주의점</strong><pre>${escapeHtml(body || "-")}</pre></section>`; }
    function menuStatsHtml() {
      const counts = { filled: 0, "메인": 0, "사이드": 0, "샐러드": 0 };
      visibleRecipes().forEach(recipe => {
        counts.filled += 1;
        counts[recipe.type] = (counts[recipe.type] || 0) + 1;
      });
      return `
        <div class="summary">
          <div class="stat"><span>등록 메뉴</span><strong>${counts.filled}</strong></div>
          <div class="stat"><span>메인</span><strong>${counts["메인"]}</strong></div>
          <div class="stat"><span>사이드</span><strong>${counts["사이드"]}</strong></div>
          <div class="stat"><span>샐러드</span><strong>${counts["샐러드"]}</strong></div>
        </div>
      `;
    }
    function openRecipeModal(recipeId = null) {
      state.editingRecipeId = recipeId;
      const recipe = recipes.find(item => item.id === recipeId);
      document.querySelector("#newRecipeTitle").textContent = recipe ? "메뉴수정" : "신규메뉴등록";
      document.querySelector("#newName").value = recipe?.name || "";
      document.querySelector("#newType").value = recipe?.type || "메인";
      document.querySelector("#newTime").value = recipe?.time || "";
      document.querySelector("#newIngredients").value = recipe?.mainIngredients || "";
      document.querySelector("#newSauce").value = recipe?.sauceIngredients || "";
      document.querySelector("#newRecipeText").value = recipe?.recipe || "";
      document.querySelector("#newNotes").value = recipe?.notes || "";
      els.modal.classList.add("open");
    }
    function closeRecipeModal() {
      state.editingRecipeId = null;
      document.querySelector("#newRecipeForm").reset();
      document.querySelector("#newRecipeTitle").textContent = "신규메뉴등록";
      els.modal.classList.remove("open");
    }
    function deleteRecipe(recipeId) {
      const index = recipes.findIndex(recipe => recipe.id === recipeId);
      if (index === -1) return;
      recipes.splice(index, 1);
      const savedIndex = savedRecipes.findIndex(recipe => recipe.id === recipeId);
      if (savedIndex >= 0) {
        savedRecipes.splice(savedIndex, 1);
        saveJson(recipeStoreKey, savedRecipes);
      }
      if (starterRecipes.some(recipe => recipe.id === recipeId) && !deletedRecipeIds.includes(recipeId)) {
        deletedRecipeIds.push(recipeId);
        saveJson(deletedRecipeStoreKey, deletedRecipeIds);
      }
      Object.keys(state.plan).forEach(key => {
        if (state.plan[key]?.recipeId === recipeId) delete state.plan[key];
      });
      savePlan();
      if (state.selectedId === recipeId) state.selectedId = recipes[0]?.id || null;
      renderAll();
    }
    function normalizeRecipeRecord(record, index = 0, prefix = "sheet") {
      const source = record || {};
      const value = (...names) => {
        const keys = Object.keys(source);
        const wanted = names.map(normalizeHeader);
        const key = keys.find(item => wanted.includes(normalizeHeader(item)));
        return key ? String(source[key] || "").trim() : "";
      };
      const name = value("메뉴 이름", "메뉴이름", "name", "menu");
      if (!name) return null;
      return {
        id: value("id", "메뉴ID", "recipeId") || `${prefix}-${Date.now()}-${index}`,
        language: value("언어", "language") || state.language,
        school: value("학교", "학교코드", "school"),
        chefTeam: value("쉐프팀", "작성자", "chef", "author"),
        type: normalizeType(value("분류", "메인/사이드", "메인사이드", "type")) || "메인",
        name,
        time: value("소요시간", "시간", "time"),
        mainIngredients: value("주재료", "재료", "main ingredients"),
        sauceIngredients: value("소스재료", "소스", "sauce ingredients"),
        recipe: value("레시피", "recipe"),
        notes: value("주의사항", "주의점", "notes"),
        imageUrl: value("사진URL", "사진 URL", "이미지URL", "이미지 URL", "사진", "imageUrl", "image url", "photo", "photoUrl")
      };
    }
    function normalizePriceRecord(record) {
      const source = record || {};
      const value = (...names) => {
        const keys = Object.keys(source);
        const wanted = names.map(normalizeHeader);
        const key = keys.find(item => wanted.includes(normalizeHeader(item)));
        return key ? String(source[key] || "").trim() : "";
      };
      const name = value("재료명", "재료", "ingredient", "name");
      const unitInfo = normalizePriceUnit(value("단위", "unit"));
      const baseAmount = parsePriceNumber(value("기준수량", "기준 수량", "수량", "amount", "base amount")) * unitInfo.factor;
      const price = parsePriceNumber(value("가격", "금액", "price", "cost"));
      if (!name || !unitInfo.unit || !baseAmount || !price) return null;
      return {
        name,
        unit: unitInfo.unit,
        baseAmount,
        price,
        link: value("구매링크", "구매 링크", "링크", "url", "link")
      };
    }
    function parsePriceNumber(value) {
      const cleaned = String(value || "").replace(/[^\d./-]/g, "");
      if (cleaned.includes("/")) return parseIngredientNumber(cleaned);
      return Number(cleaned || 0);
    }
    function normalizePriceUnit(unit) {
      const raw = String(unit || "").trim();
      if (/^kg$/i.test(raw)) return { unit: "g", factor: 1000 };
      if (/^g$/i.test(raw)) return { unit: "g", factor: 1 };
      if (/^l$/i.test(raw)) return { unit: "ml", factor: 1000 };
      if (/^ml$/i.test(raw)) return { unit: "ml", factor: 1 };
      if (raw === "T") return { unit: "큰술", factor: 1 };
      if (raw === "t") return { unit: "작은술", factor: 1 };
      return { unit: raw, factor: 1 };
    }

    async function loadSheetsData() {

        return await response.json();

    function loadSheetsDataJsonp() {
      return new Promise((resolve, reject) => {
        const callbackName = `gpahSheetsCallback${Date.now()}`;
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          delete window[callbackName];
          script.remove();
          reject(new Error("Apps Script 응답 시간이 초과되었습니다."));
        }, 12000);
        window[callbackName] = data => {
          clearTimeout(timer);
          delete window[callbackName];
          script.remove();
          resolve(data);
        };
        script.onerror = () => {
          clearTimeout(timer);
          delete window[callbackName];
          script.remove();
          reject(new Error("Apps Script URL을 불러오지 못했습니다."));
        };
        script.src = withQuery(state.sheetsUrl, { action: "list", callback: callbackName });
        document.body.appendChild(script);
      });
    }
    function withQuery(baseUrl, params) {
      const separator = baseUrl.includes("?") ? "&" : "?";

    }

      try {
        await fetch(state.sheetsUrl, { method: "POST", mode: "no-cors", body: form });
      } catch {
        const formEl = document.createElement("form");
        const frameName = `gpahSheetsFrame${Date.now()}`;
        const frame = document.createElement("iframe");
        frame.name = frameName;
        frame.hidden = true;
        formEl.method = "POST";
        formEl.action = state.sheetsUrl;
        formEl.target = frameName;
        formEl.hidden = true;
        [["action", "upsert"], ["data", JSON.stringify(recipe)]].forEach(([name, value]) => {
          const input = document.createElement("input");
          input.name = name;
          input.value = value;
          formEl.appendChild(input);

        formEl.submit();

    function riceEntryLabel(entry) {
      if (!entry) return "";
      const parts = [];
      if (entry.riceKg) parts.push(`쌀 ${entry.riceKg}kg`);
      if (entry.grainName || entry.grainKg) parts.push(`${entry.grainName || "잡곡"} ${entry.grainKg || 0}kg`);

    function teamForWeek(week) {
      const startsWithA = state.startTeam === "a";
      const isStartWeek = week % 2 === 1;
      const key = startsWithA === isStartWeek ? "a" : "b";
      return key === "a" ? { key: "a", label: "A팀" } : { key: "b", label: "B팀" };
    }
    function parseDate(value) {
      const parts = String(value || "").split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return new Date(2026, 7, 31);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }
    function addDays(date, amount) {
      const next = new Date(date);
      next.setDate(next.getDate() + amount);
      return next;
    }
    function weekStartForDate(date) {
      const mondayOffset = (date.getDay() + 6) % 7;
      return addDays(date, -mondayOffset);
    }
    function dateForCell(week, dayIndex) {
      return addDays(weekStartForDate(parseDate(state.startDate)), (week - 1) * 7 + dayIndex);
    }
    function formatDate(date) {
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }
    function formatInputDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;

    function buildPurchaseReport() {
      const start = parseDate(state.purchaseStart);
      const end = parseDate(state.purchaseEnd);
      end.setHours(23, 59, 59, 999);
      const mainTotals = new Map();
      const sauceTotals = new Map();
      const extraTotals = new Map();
      const review = [];
      const menuKeys = new Set();
      for (let week = 1; week <= currentCourse().weeks; week++) {
        days.forEach((day, dayIndex) => {
          const cellDate = dateForCell(week, dayIndex);
          if (cellDate < start || cellDate > end) return;
          Object.keys(mealLabels).forEach(meal => {

      saveSharedCalendarSettings();
      renderPurchase();
    });
    document.querySelector("#purchaseFullCourse").addEventListener("click", () => {
      state.purchaseStart = state.startDate;
      state.purchaseEnd = formatInputDate(dateForCell(currentCourse().weeks, days.length - 1));
      syncSelectors();
      saveSharedCalendarSettings();
      renderPurchase();
    });
    document.querySelector("#toggleCalendarSettings").addEventListener("click", openCalendarCreateModal);
    document.querySelector("#closeCalendarCreate").addEventListener("click", closeCalendarCreateModal);
    document.querySelector("#createCalendar").addEventListener("click", createCalendarFromModal);
    document.querySelector("#exportExcel").addEventListener("click", exportExcel);
    document.querySelector("#editMealDetail").addEventListener("click", editActiveMealDetail);
    document.querySelector("#printMealDetail").addEventListener("click", downloadMealDetail);
    document.querySelector("#closeRecipeDetail").addEventListener("click", closeRecipeDetailModal);
    document.querySelector("#openNewRecipe").addEventListener("click", () => openRecipeModal());
    document.querySelector("#cancelNewRecipe").addEventListener("click", closeRecipeModal);
    document.querySelector("#openSheetsSettings").addEventListener("click", openSheetsModal);
    document.querySelector("#closeSheetsSettings").addEventListener("click", closeSheetsModal);
    document.querySelector("#saveSheetsSettings").addEventListener("click", saveSheetsUrl);
    document.querySelector("#syncSheetsNow").addEventListener("click", syncRecipesFromSheets);
    document.querySelector("#unlockAdmin").addEventListener("click", unlockAdminSettings);
    els.adminPassword.addEventListener("keydown", event => {
      if (event.key === "Enter") unlockAdminSettings();
    });
    els.modal.addEventListener("click", event => { if (event.target === els.modal) closeRecipeModal(); });
    els.sheetsModal.addEventListener("click", event => { if (event.target === els.sheetsModal) closeSheetsModal(); });
    els.mealDetailModal.addEventListener("click", event => { if (event.target === els.mealDetailModal) els.mealDetailModal.classList.remove("open"); });
    els.recipeDetailModal.addEventListener("click", event => { if (event.target === els.recipeDetailModal) closeRecipeDetailModal(); });
    document.querySelector("#newRecipeForm").addEventListener("submit", async event => {
      event.preventDefault();
      const editingRecipe = recipes.find(recipe => recipe.id === state.editingRecipeId);
      const recipe = {
        id: editingRecipe?.id || `custom-${Date.now()}`,
        language: editingRecipe?.language || state.language,
        school: editingRecipe?.school || "",
        chefTeam: editingRecipe?.chefTeam || "",
        type: document.querySelector("#newType").value,
        name: document.querySelector("#newName").value.trim(),
        time: document.querySelector("#newTime").value.trim(),
        mainIngredients: document.querySelector("#newIngredients").value.trim(),
        sauceIngredients: document.querySelector("#newSauce").value.trim(),
        recipe: document.querySelector("#newRecipeText").value.trim(),
        notes: document.querySelector("#newNotes").value.trim()
      };
      if (editingRecipe) {
        Object.assign(editingRecipe, recipe);
        const savedIndex = savedRecipes.findIndex(item => item.id === recipe.id);
        if (savedIndex >= 0) savedRecipes[savedIndex] = recipe;
        else savedRecipes.push(recipe);
      } else {
        recipes.push(recipe);
        savedRecipes.push(recipe);
      }
      saveJson(recipeStoreKey, savedRecipes);
      state.selectedId = recipe.id;
      closeRecipeModal();
      renderAll();
      await postRecipeToSheets(recipe);
    });
    syncSelectors();
    if (sessionStorage.getItem("gpah-admin") === "ok") showAdminSettings();
    renderAll();
    if (state.sheetsUrl) syncRecipesFromSheets({ saveUrl: false });
  </script>
</body>
</html>
